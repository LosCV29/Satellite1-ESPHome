substitutions:
  # Defaults point at this fork because the component list below now includes
  # http_request, which is vendored here and does not exist upstream.
  ext_comp_repo_url: https://github.com/LosCV29/Satellite1-ESPHome
  ext_comp_repo_ref: v0.2.0-carlos-2026.9.1

external_components:
  - source:
      type: git
      url: ${ext_comp_repo_url}
      ref: ${ext_comp_repo_ref}
    refresh: 1s
    components:
      - fusb302b
      - i2s_audio
      - memory_flasher
      - pcm5122
      - satellite1
      - satellite1_radar
      - tas2780
      # Vendored from esphome PR #12429 (closed, never merged) because it is the
      # only source of the http_request media_source platform, which upstream
      # still does not provide. Our copy adds the esp-tls declaration that the
      # PR branch lacks -- see esphome/components/http_request/__init__.py.
      - http_request
